# Fly.io configuration for the Easy order COD app.
# `app` must be globally unique — change it if `fly launch` says it's taken,
# and set `primary_region` to the code nearest you (e.g. sin, iad, fra, bom).
app = "easy-order-cod"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  # SQLite on the [[mounts]] volume below, so the database survives deploys.
  # `npm run setup` runs `prisma migrate deploy` against this at every boot.
  DATABASE_URL = "file:/data/prod.sqlite"
  # Must match this app's own https URL, or OAuth redirects land nowhere.
  SHOPIFY_APP_URL = "https://easy-order-cod.fly.dev"
  # Public client id — the same value as [client_id] in shopify.app.toml.
  SHOPIFY_API_KEY = "7d6846fb9f944b6701f6cc35b77eab6f"
  # Keep in sync with shopify.app.production.toml [access_scopes].
  SCOPES = "read_orders,write_orders,read_products,read_shipping"
  # SHOPIFY_API_SECRET is NOT here on purpose — set it once with:
  #   flyctl secrets set SHOPIFY_API_SECRET=shpss_...

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always running so the embedded app loads instantly and
  # webhooks are never missed.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Persistent disk for the SQLite database (survives deploys/restarts).
[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
