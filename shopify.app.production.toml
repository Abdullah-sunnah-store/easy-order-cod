# Release configuration - the URLs that ship to the App Store.
#
# Every URL below must point at the permanent production host and nothing
# else. A released version carrying a dev tunnel is what the App Store
# reviewer hit: the tunnel had stopped resolving, so the embedded iframe
# rendered Chrome's "server IP address could not be found" and the review
# failed under 2.3.3 and 2.1.1.
#
# The host is Vercel: https://easy-order-cod.vercel.app
#
# `shopify app dev` rewrites the URL fields of whichever config is active, so
# keep development on shopify.app.toml and release from this file:
#
#   npm run deploy          # runs the pre-flight, then releases from here
#
# automatically_update_urls_on_dev is false here so a stray `dev` run can never
# point the published app at a Cloudflare tunnel.

client_id = "7d6846fb9f944b6701f6cc35b77eab6f"
name = "Easy order COD"
application_url = "https://easy-order-cod.vercel.app/app"
embedded = true
handle = "easy-order-cod"

[build]
automatically_update_urls_on_dev = false

# The storefront block reads its wording, appearance and add-on offers from
# /apps/cod/settings through this proxy. Without it the block renders bare.
[app_proxy]
url = "https://easy-order-cod.vercel.app/proxy"
subpath = "cod"
prefix = "apps"

[webhooks]
api_version = "2026-07"

# Every uri below is ABSOLUTE, and must stay that way.
#
# The CLI turns a relative uri into an endpoint by concatenating it onto
# application_url. application_url is "https://easy-order-cod.vercel.app/app",
# so uri = "/webhooks/app/uninstalled" registered as
# ".../app/webhooks/app/uninstalled" - a path the app does not serve. Shopify
# got a 404 instead of a signed 401, which failed the "Verifies webhooks with
# HMAC signatures" automated check, and app/uninstalled never fired at all.
#
# `npm run check:release` now resolves these the same way the CLI does and
# probes one of them, so this cannot ship again.

  # App lifecycle
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/app/scopes_update"

  # Recognises the orders Shopify checkout creates from the COD button, so the
  # app can tag them and count them against the plan. The app does not create
  # orders itself.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/orders/create"

  # Mandatory GDPR / privacy compliance webhooks (required for App Store apps)
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/shop/redact"

[access_scopes]
# Only what the app actually uses. It does not create orders — Shopify
# checkout does — but it tags the ones that came from the COD button, which
# needs write_orders. read_products resolves the add-on offers.
scopes = "read_orders,write_orders,read_products"

[auth]
redirect_urls = [
  "https://easy-order-cod.vercel.app/auth/callback",
  "https://easy-order-cod.vercel.app/auth/shopify/callback",
  "https://easy-order-cod.vercel.app/api/auth/callback"
]

[pos]
embedded = false
