# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7d6846fb9f944b6701f6cc35b77eab6f"
name = "Easy order COD"
# MUST be the bare origin, with no /app path. Relative [[webhooks.subscriptions]]
# uris are resolved against this value, so a trailing /app registers the
# compliance webhooks at /app/webhooks/... — which matches no route, and fails
# Shopify's "Verifies webhooks with HMAC signatures" check. Install still lands
# on the app UI: routes/_index redirects to /app when ?shop= is present.
application_url = "https://drivers-prescription-vaccine-collaborative.trycloudflare.com"
embedded = true
handle = "easy-order-cod"

[build]
# Push the tunnel URLs to the Partner dashboard on dev so the embedded iframe
# loads the public HTTPS tunnel instead of localhost. NOTE: `shopify app dev`
# rewrites application_url, redirect_urls and app_proxy.url in THIS file while
# it runs. Release from shopify.app.production.toml instead — see that file.
automatically_update_urls_on_dev = true

# The storefront form reads /apps/cod/settings through this proxy. Without it
# that path 404s and the form falls back to its built-in defaults.
#
# There is deliberately no order endpoint here any more: the form builds a
# Shopify cart and hands off to Shopify checkout, which is what creates the
# order (App Store requirement 1.1.2).
[app_proxy]
url = "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/proxy"
subpath = "cod"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  # App lifecycle
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Shopify creates COD orders at its own checkout now, so this webhook is the
  # only way the app learns that one happened. It backs the Orders page and the
  # plan's monthly allowance; the handler ignores every order whose cart is not
  # marked with the COD "Order type" attribute.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # Mandatory GDPR / privacy compliance webhooks (required for App Store apps).
  #
  # These are ABSOLUTE on purpose. Relative uris get resolved against
  # application_url, which is how they ended up registered at
  # /app/webhooks/... and failed Shopify's HMAC signature check. An absolute
  # https URL cannot be rewritten by application_url, so what Shopify probes is
  # exactly what is written here.
  #
  # Compliance endpoints only change on `shopify app deploy` — `shopify app dev`
  # updates application_url but does NOT refresh these. Re-deploy when the host
  # changes, and swap them to the production host before submitting.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/webhooks/shop/redact"

[access_scopes]
# Only what the COD app actually uses. write_orders and read_shipping are gone:
# the app no longer creates orders or quotes shipping — Shopify checkout does
# both (App Store requirement 1.1.2). read_orders backs the Orders page and the
# orders/create webhook; write_discounts backs the upsell offers, whose
# percentages are now real Shopify discounts applied at checkout.
scopes = "read_orders,read_products,read_discounts,write_discounts"

[auth]
redirect_urls = [
  "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/auth/callback",
  "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/auth/shopify/callback",
  "https://drivers-prescription-vaccine-collaborative.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
