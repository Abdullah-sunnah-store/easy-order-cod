# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7d6846fb9f944b6701f6cc35b77eab6f"
name = "Easy order COD"
# MUST be the bare origin, with no /app path. Relative [[webhooks.subscriptions]]
# uris are resolved against this value, so a trailing /app registers the
# compliance webhooks at /app/webhooks/... — which matches no route, and fails
# Shopify's "Verifies webhooks with HMAC signatures" check. Install still lands
# on the app UI: routes/_index redirects to /app when ?shop= is present.
application_url = "https://easy-order-cod.vercel.app"
embedded = true
handle = "easy-order-cod"

[build]
# Push the tunnel URLs to the Partner dashboard on dev so the embedded iframe
# loads the public HTTPS tunnel instead of localhost. NOTE: `shopify app dev`
# rewrites application_url, redirect_urls and app_proxy.url in THIS file while
# it runs. Release from shopify.app.production.toml instead — see that file.
automatically_update_urls_on_dev = true

# The storefront block reads its wording, appearance and add-on offers from
# /apps/cod/settings through this proxy. Without it the block renders bare.
[app_proxy]
url = "https://easy-order-cod.vercel.app/proxy"
subpath = "cod"
prefix = "apps"

[webhooks]
api_version = "2026-07"

# These stay RELATIVE, unlike the release config, because `shopify app dev`
# rewrites application_url to the tunnel root - which has no path - so a
# relative uri resolves correctly there. Never deploy this file: outside a dev
# session application_url is ".../app", and the CLI would concatenate these
# into /app/webhooks/..., which the app answers with a 404. See the same block
# in shopify.app.production.toml.

  # App lifecycle
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Recognises the orders Shopify checkout creates from the COD button, so the
  # app can tag them and count them against the plan. The app does not create
  # orders itself.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # Mandatory GDPR / privacy compliance webhooks (required for App Store apps).
  #
  # These are ABSOLUTE on purpose. Relative uris get resolved against
  # application_url, which is how they ended up registered at
  # /app/webhooks/... and failed Shopify's HMAC signature check. An absolute
  # https URL cannot be rewritten by application_url, so what Shopify probes is
  # exactly what is written here.
  #
  # Compliance endpoints only change on `shopify app deploy` — `shopify app dev`
  # updates application_url but does NOT refresh these. Re-deploy when the host
  # changes, and swap them to the production host before submitting.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "https://easy-order-cod.vercel.app/webhooks/shop/redact"

[access_scopes]
# Only what the app actually uses. It does not create orders — Shopify
# checkout does — but it tags the ones that came from the COD button, which
# needs write_orders. read_products resolves the add-on offers. write_discounts
# turns quantity offers, bundles and the downsell into real Shopify discounts,
# so checkout charges exactly the price the form shows.
scopes = "read_orders,write_orders,read_products,write_discounts"

[auth]
redirect_urls = [
  "https://easy-order-cod.vercel.app/auth/callback",
  "https://easy-order-cod.vercel.app/auth/shopify/callback",
  "https://easy-order-cod.vercel.app/api/auth/callback"
]

[pos]
embedded = false
